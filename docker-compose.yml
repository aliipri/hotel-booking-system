services:
  db:
    image: postgres:16
    container_name: hotel-booking-db
    environment:
      POSTGRES_DB: ${DB_NAME:-hotel_booking}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-hotel_booking}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: hotel-booking-app
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-hotel_booking}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
